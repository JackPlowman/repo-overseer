[project]
name = "tests"
dynamic = ["version"]
requires-python = "~=3.13.0"
dependencies = [
  "pytest==9.1.1",
  "pytest-playwright==0.10.0",
  "requests==2.34.2",
  "pytest-rerunfailures==16.7",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.2",
    "ty==0.0.92",
]

[tool.uv]
required-version = "~=0.13.0"
package = false


[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]

ignore = [
  "CPY001", # Copyright headers are not required by this project
  "COM812",  # Ignore due to conflict with Ruff formatter
  "ISC001",  # Ignore due to conflict with Ruff formatter
  "PLR2004", # Ignore magic value
  "D104",    # Ignore missing docstring in public package
  "S101",    # Ignore use of assert
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"
